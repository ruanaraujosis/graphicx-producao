name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Valores fictícios: o build não acessa o Supabase.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Procurar credenciais nos arquivos versionados
        run: npm run segredos:verificar
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  migrations:
    name: Validar migrations do Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Subir Postgres e aplicar todas as migrations do zero
        run: supabase db start
      - name: Lint do schema (erros de PL/pgSQL e referências quebradas)
        run: supabase db lint --level error --fail-on error
      - name: Testes do banco (pgTAP em supabase/tests)
        run: supabase test db

  e2e:
    name: E2E (Playwright)
    # Em todo PR (pega o problema antes do merge) e no push da develop.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      # Supabase local (banco, Auth, Storage e API) com as migrations: telas que usam o banco
      # rodam de verdade. As chaves são as padrão do Supabase local, não segredos.
      - name: Subir o Supabase local
        id: supabase
        run: |
          supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,mailpit,realtime
          supabase status -o json > /tmp/supabase.json
          {
            echo "url=$(jq -r '.API_URL' /tmp/supabase.json)"
            echo "publishable=$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' /tmp/supabase.json)"
            echo "secret=$(jq -r '.SECRET_KEY // .SERVICE_ROLE_KEY' /tmp/supabase.json)"
          } >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable }}
      - run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ steps.supabase.outputs.url }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable }}
          SUPABASE_SECRET_KEY: ${{ steps.supabase.outputs.secret }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
