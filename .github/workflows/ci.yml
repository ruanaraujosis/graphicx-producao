name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Valores fictícios: o build não acessa o Supabase.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  qualidade:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Procurar credenciais nos arquivos versionados
        run: npm run segredos:verificar
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build

  migrations:
    name: Validar migrations do Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Subir Postgres e aplicar todas as migrations do zero
        run: supabase db start
      - name: Lint do schema (erros de PL/pgSQL e referências quebradas)
        run: supabase db lint --level error --fail-on error
      - name: Testes do banco (pgTAP em supabase/tests)
        run: supabase test db

  e2e:
    name: E2E (Playwright)
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
