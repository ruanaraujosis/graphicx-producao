name: Aplicar migrations

# develop → Supabase de homologação; main → Supabase de produção.
# Requer os secrets por ambiente (Settings > Environments):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD
on:
  push:
    branches: [main, develop]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: migrations-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'producao' || 'homologacao' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Verificar secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Secrets do Supabase não configurados para este ambiente; migrations não aplicadas."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: supabase/setup-cli@v1
        if: env.SKIP != '1'
        with:
          version: 2.120.0
      - if: env.SKIP != '1'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - if: env.SKIP != '1'
        run: supabase db push
