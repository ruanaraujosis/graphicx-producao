version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "eslint-config-next", "@types/react*"]
      supabase:
        patterns: ["@supabase/*", "supabase"]
      testes:
        patterns: ["vitest", "@vitest/*", "@playwright/test", "@testing-library/*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
